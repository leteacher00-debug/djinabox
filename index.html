<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoMix DJ - Beat-Synced Player</title>
  <style>
    :root {
      --bg-main: #0a0c10;
      --bg-card: #121620;
      --bg-card-hover: #1a202c;
      --accent-blue: #00f2fe;
      --accent-purple: #9d50bb;
      --accent-pink: #ff007f;
      --text-main: #f0f4f8;
      --text-dim: #718096;
      --border-color: #2d3748;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    h1 {
      font-size: 1.5rem;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-size: 0.8rem;
      background: rgba(0, 242, 254, 0.1);
      color: var(--accent-blue);
      padding: 4px 12px;
      border-radius: 12px;
      border: 1px solid rgba(0, 242, 254, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-blue);
    }

    .status-dot.active {
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; transform: scale(1.2); }
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    @media (min-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr 320px;
      }
    }

    .dj-console {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .decks-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .deck {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
    }

    .deck.active-deck {
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.1);
    }

    .deck-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .deck-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-dim);
    }

    .deck-bpm {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent-blue);
    }

    .deck-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 12px;
      height: 22px;
    }

    .vinyl-wrapper {
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }

    .vinyl {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #000 30%, #111 31%, #222 60%, #000 61%);
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-center {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--accent-blue), var(--accent-pink));
    }

    .vinyl.spinning {
      animation: rotateVinyl 2s linear infinite;
    }

    @keyframes rotateVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #1a202c;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
    }

    .mixer-section {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .crossfader-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: bold;
    }

    .crossfader-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #1a202c;
      outline: none;
    }

    .crossfader-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: var(--text-main);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .transition-indicator {
      text-align: center;
      font-size: 0.8rem;
      color: var(--accent-pink);
      height: 18px;
      font-weight: 600;
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (min-width: 500px) {
      .controls-row {
        grid-template-columns: auto 1fr auto;
      }
    }

    .btn {
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1deg);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-blue), #00a8ff);
      color: #000;
    }

    .btn-automix {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      color: #fff;
    }

    .btn-skip {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .visualizer-container {
      width: 100%;
      height: 50px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    .sidebar {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-upload {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px dashed var(--border-color);
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
      display: block;
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }

    .queue-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.2s;
    }

    .queue-item:hover {
      background: var(--bg-card-hover);
    }

    .queue-item.playing {
      border-color: var(--accent-blue);
      background: rgba(0, 242, 254, 0.05);
    }

    .queue-title {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .queue-bpm {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .tag-demo {
      font-size: 0.65rem;
      background: rgba(157, 80, 187, 0.3);
      color: #e2b0ff;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-icon">DJ</div>
      <div>
        <h1>AutoMix DJ</h1>
        <p style="font-size: 0.75rem; color: var(--text-dim);">Beatmatched Precision Sync</p>
      </div>
    </div>
    <div class="status-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Pronto</span>
    </div>
  </header>

  <div class="main-grid">
    <div class="dj-console">
      <div class="visualizer-container">
        <canvas id="visualizer"></canvas>
      </div>

      <div class="decks-container">
        <div class="deck active-deck" id="deckA">
          <div class="deck-header">
            <span class="deck-label">DECK A</span>
            <span class="deck-bpm" id="deckA-bpm">-- BPM</span>
          </div>
          <div class="deck-title" id="deckA-title">Carregando...</div>
          <div class="vinyl-wrapper">
            <div class="vinyl" id="vinylA"><div class="vinyl-center"></div></div>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar" id="deckA-progress"></div>
          </div>
        </div>

        <div class="deck" id="deckB">
          <div class="deck-header">
            <span class="deck-label">DECK B</span>
            <span class="deck-bpm" id="deckB-bpm">-- BPM</span>
          </div>
          <div class="deck-title" id="deckB-title">Carregando...</div>
          <div class="vinyl-wrapper">
            <div class="vinyl" id="vinylB"><div class="vinyl-center"></div></div>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar" id="deckB-progress"></div>
          </div>
        </div>
      </div>

      <div class="mixer-section">
        <div class="crossfader-labels">
          <span>DECK A</span>
          <span>CROSSFADER</span>
          <span>DECK B</span>
        </div>
        <input type="range" class="crossfader-slider" id="crossfader" min="0" max="100" value="0">
        <div class="transition-indicator" id="transitionStatus">Aguardando...</div>
      </div>

      <div class="controls-row">
        <button class="btn btn-primary" id="playBtn">▶ Play</button>
        <button class="btn btn-automix" id="mixNowBtn" disabled>⏭ Próxima (Com Mixagem)</button>
        <button class="btn btn-skip" id="skipInstantBtn" disabled>⏩ Pular Direto</button>
      </div>
    </div>

    <div class="sidebar">
      <h3>Fila de Reprodução</h3>
      <label class="btn-upload">
        📁 Carregar Músicas Locais (MP3)
        <input type="file" id="fileInput" style="display:none;" accept="audio/*" multiple>
      </label>
      <div class="queue-list" id="queueList"></div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let masterGain = null;
    let analyser = null;

    const decks = {
      A: { source: null, buffer: null, bpm: 120, title: "", lowFilter: null, gainNode: null, duration: 0, startTime: 0, offset: 0, isPlaying: false, beatOffset: 0 },
      B: { source: null, buffer: null, bpm: 120, title: "", lowFilter: null, gainNode: null, duration: 0, startTime: 0, offset: 0, isPlaying: false, beatOffset: 0 }
    };

    let activeDeckKey = 'A';
    let isPlayingGlobal = false;
    let isTransitioning = false;
    let playlist = [];
    let currentPlaylistIndex = 0;

    const playBtn = document.getElementById('playBtn');
    const mixNowBtn = document.getElementById('mixNowBtn');
    const skipInstantBtn = document.getElementById('skipInstantBtn');
    const crossfader = document.getElementById('crossfader');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const transitionStatus = document.getElementById('transitionStatus');
    const queueListEl = document.getElementById('queueList');
    const fileInput = document.getElementById('fileInput');

    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        masterGain = audioCtx.createGain();
        masterGain.connect(analyser);
        analyser.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function detectBPMAndFirstBeat(buffer) {
      const data = buffer.getChannelData(0);
      const sampleRate = buffer.sampleRate;
      let maxEnergy = 0;
      let firstBeatFrame = 0;

      for (let i = 0; i < sampleRate * 5; i += 100) {
        let energy = Math.abs(data[i]);
        if (energy > maxEnergy && energy > 0.3) {
          maxEnergy = energy;
          firstBeatFrame = i;
          break;
        }
      }

      const beatOffset = firstBeatFrame / sampleRate;
      return { bpm: 124, beatOffset };
    }

    function generateSyntheticTrack(bpm, type) {
      initAudioContext();
      const sampleRate = audioCtx.sampleRate;
      const duration = 20;
      const numFrames = sampleRate * duration;
      const buffer = audioCtx.createBuffer(2, numFrames, sampleRate);
      const left = buffer.getChannelData(0);
      const right = buffer.getChannelData(1);
      const beatInterval = 60 / bpm;
      const beatSamples = sampleRate * beatInterval;

      for (let i = 0; i < numFrames; i++) {
        const time = i / sampleRate;
        const positionInBeat = (i % beatSamples) / beatSamples;
        let sample = 0;

        if (positionInBeat < 0.1) {
          const kickFreq = 130 * Math.exp(-positionInBeat * 30);
          sample += Math.sin(2 * Math.PI * kickFreq * time);
        }
        sample += Math.sin(2 * Math.PI * 60 * time) * 0.2;

        left[i] = sample * 0.7;
        right[i] = sample * 0.7;
      }
      return buffer;
    }

    function loadDemoTracks() {
      playlist = [
        { title: "Deep House Groove", bpm: 124, buffer: generateSyntheticTrack(124, 'house'), isDemo: true, beatOffset: 0 },
        { title: "Techno Pulse", bpm: 128, buffer: generateSyntheticTrack(128, 'techno'), isDemo: true, beatOffset: 0 },
        { title: "Electro Drive", bpm: 120, buffer: generateSyntheticTrack(120, 'house'), isDemo: true, beatOffset: 0 }
      ];
      renderQueue();
      prepareDecks();
    }

    fileInput.addEventListener('change', async (e) => {
      initAudioContext();
      const files = Array.from(e.target.files);
      for (const file of files) {
        statusText.innerText = "Analisando batidas...";
        const arrayBuffer = await file.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        const analysis = detectBPMAndFirstBeat(audioBuffer);

        playlist.push({
          title: file.name.replace(/\.[^/.]+$/, ""),
          bpm: analysis.bpm,
          buffer: audioBuffer,
          isDemo: false,
          beatOffset: analysis.beatOffset
        });
      }
      statusText.innerText = "Pronto";
      renderQueue();
      prepareDecks();
    });

    function renderQueue() {
      queueListEl.innerHTML = '';
      playlist.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `queue-item ${index === currentPlaylistIndex ? 'playing' : ''}`;
        item.innerHTML = `
          <div class="queue-info">
            <span class="queue-title">${index + 1}. ${track.title} ${track.isDemo ? '<span class="tag-demo">DEMO</span>' : ''}</span>
            <span class="queue-bpm">${track.bpm} BPM</span>
          </div>
        `;
        item.addEventListener('click', () => jumpToTrack(index));
        queueListEl.appendChild(item);
      });
    }

    function prepareDecks() {
      if (playlist.length === 0) return;
      setupDeck('A', playlist[currentPlaylistIndex]);
      setupDeck('B', playlist[(currentPlaylistIndex + 1) % playlist.length]);
      mixNowBtn.disabled = false;
      skipInstantBtn.disabled = false;
    }

    function setupDeck(deckKey, track) {
      const deck = decks[deckKey];
      deck.buffer = track.buffer;
      deck.bpm = track.bpm;
      deck.title = track.title;
      deck.duration = track.buffer.duration;
      deck.beatOffset = track.beatOffset || 0;

      document.getElementById(`deck${deckKey}-title`).innerText = track.title;
      document.getElementById(`deck${deckKey}-bpm`).innerText = `${track.bpm} BPM`;
    }

    function createDeckAudioNodes(deckKey) {
      const deck = decks[deckKey];
      if (deck.source) { try { deck.source.stop(); } catch(e){} }

      deck.source = audioCtx.createBufferSource();
      deck.source.buffer = deck.buffer;

      deck.lowFilter = audioCtx.createBiquadFilter();
      deck.lowFilter.type = "lowshelf";
      deck.lowFilter.frequency.value = 300;
      deck.lowFilter.gain.value = 0;

      deck.gainNode = audioCtx.createGain();

      deck.source.connect(deck.lowFilter);
      deck.lowFilter.connect(deck.gainNode);
      deck.gainNode.connect(masterGain);

      const xVal = parseFloat(crossfader.value) / 100;
      deck.gainNode.gain.value = deckKey === 'A' ? Math.cos(xVal * 0.5 * Math.PI) : Math.sin(xVal * 0.5 * Math.PI);
    }

    playBtn.addEventListener('click', () => {
      initAudioContext();
      if (isPlayingGlobal) pauseAll(); else playActiveDeck();
    });

    function playActiveDeck() {
      const deck = decks[activeDeckKey];
      createDeckAudioNodes(activeDeckKey);
      
      deck.source.start(0, deck.offset);
      deck.startTime = audioCtx.currentTime - deck.offset;
      deck.isPlaying = true;
      isPlayingGlobal = true;

      playBtn.innerText = "⏸ Pause";
      statusDot.classList.add('active');
      statusText.innerText = "Tocando";
      document.getElementById(`vinyl${activeDeckKey}`).classList.add('spinning');
    }

    function pauseAll() {
      Object.keys(decks).forEach(key => {
        const deck = decks[key];
        if (deck.isPlaying && deck.source) {
          try { deck.source.stop(); deck.offset = audioCtx.currentTime - deck.startTime; } catch(e){}
          deck.isPlaying = false;
        }
        document.getElementById(`vinyl${key}`).classList.remove('spinning');
      });
      isPlayingGlobal = false;
      playBtn.innerText = "▶ Play";
      statusDot.classList.remove('active');
      statusText.innerText = "Pausado";
    }

    // --- BOTÃO DE PULAR INSTANTÂNEO ---
    skipInstantBtn.addEventListener('click', () => {
      jumpToTrack((currentPlaylistIndex + 1) % playlist.length);
    });

    function jumpToTrack(targetIndex) {
      if (isTransitioning) return;
      initAudioContext();
      
      const wasPlaying = isPlayingGlobal;
      pauseAll();

      currentPlaylistIndex = targetIndex;
      renderQueue();

      activeDeckKey = 'A';
      crossfader.value = 0;

      setupDeck('A', playlist[currentPlaylistIndex]);
      setupDeck('B', playlist[(currentPlaylistIndex + 1) % playlist.length]);

      document.getElementById('deckA').classList.add('active-deck');
      document.getElementById('deckB').classList.remove('active-deck');

      decks.A.offset = 0;
      decks.B.offset = 0;

      transitionStatus.innerText = `Mudou para a faixa ${targetIndex + 1}`;

      if (wasPlaying) {
        playActiveDeck();
      }
    }

    // --- ALINHAMENTO DE BEAT EM TEMPO REAL (AUTOMIX) ---
    mixNowBtn.addEventListener('click', () => {
      if (!isPlayingGlobal) playActiveDeck();
      triggerBeatSyncedMix();
    });

    function triggerBeatSyncedMix() {
      if (isTransitioning) return;
      isTransitioning = true;

      const currentKey = activeDeckKey;
      const nextKey = currentKey === 'A' ? 'B' : 'A';
      const currentDeck = decks[currentKey];
      const nextDeck = decks[nextKey];

      const currentBeatInterval = 60 / currentDeck.bpm;
      const elapsedTime = audioCtx.currentTime - currentDeck.startTime;
      const beatsPassed = elapsedTime / currentBeatInterval;
      const nextBeatTime = (Math.ceil(beatsPassed) * currentBeatInterval) - elapsedTime;

      transitionStatus.innerText = "Aguardando batida para mixar...";

      setTimeout(() => {
        createDeckAudioNodes(nextKey);

        const speedRatio = currentDeck.bpm / nextDeck.bpm;
        nextDeck.source.playbackRate.setValueAtTime(speedRatio, audioCtx.currentTime);

        nextDeck.source.start(0, nextDeck.beatOffset);
        nextDeck.startTime = audioCtx.currentTime - nextDeck.beatOffset;
        nextDeck.isPlaying = true;
        document.getElementById(`vinyl${nextKey}`).classList.add('spinning');

        transitionStatus.innerText = "Mixando no tempo!";

        const transitionDuration = 4.0;
        const startCrossfaderVal = currentKey === 'A' ? 0 : 100;
        const targetCrossfaderVal = currentKey === 'A' ? 100 : 0;
        let startAnimTime = null;

        function animate(timestamp) {
          if (!startAnimTime) startAnimTime = timestamp;
          const progress = Math.min((timestamp - startAnimTime) / (transitionDuration * 1000), 1);
          
          const currentVal = startCrossfaderVal + (targetCrossfaderVal - startCrossfaderVal) * progress;
          crossfader.value = currentVal;

          const rad = (currentVal / 100) * 0.5 * Math.PI;
          decks.A.gainNode.gain.value = Math.cos(rad);
          decks.B.gainNode.gain.value = Math.sin(rad);

          if (progress > 0.5) {
            currentDeck.lowFilter.gain.setValueAtTime(-24, audioCtx.currentTime);
            nextDeck.lowFilter.gain.setValueAtTime(0, audioCtx.currentTime);
          }

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            completeTransition(currentKey, nextKey);
          }
        }

        requestAnimationFrame(animate);
      }, Math.max(0, nextBeatTime * 1000));
    }

    function completeTransition(oldKey, newKey) {
      try { decks[oldKey].source.stop(); } catch(e){}
      decks[oldKey].isPlaying = false;
      document.getElementById(`vinyl${oldKey}`).classList.remove('spinning');

      activeDeckKey = newKey;
      isTransitioning = false;
      transitionStatus.innerText = `Tocando no DECK ${newKey}`;

      document.getElementById(`deck${oldKey}`).classList.remove('active-deck');
      document.getElementById(`deck${newKey}`).classList.add('active-deck');

      currentPlaylistIndex = (currentPlaylistIndex + 1) % playlist.length;
      renderQueue();
      setupDeck(oldKey, playlist[(currentPlaylistIndex + 1) % playlist.length]);
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);

      ['A', 'B'].forEach(key => {
        const deck = decks[key];
        if (deck.isPlaying) {
          const elapsed = audioCtx.currentTime - deck.startTime;
          const pct = Math.min((elapsed / deck.duration) * 100, 100);
          document.getElementById(`deck${key}-progress`).style.width = `${pct}%`;
        }
      });

      if (!analyser) return;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      canvasCtx.fillStyle = '#000';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        const gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
        gradient.addColorStop(0, '#00f2fe');
        gradient.addColorStop(1, '#ff007f');
        canvasCtx.fillStyle = gradient;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
        x += barWidth;
      }
    }

    window.addEventListener('resize', () => {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    });

    window.addEventListener('load', () => {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      drawVisualizer();
      loadDemoTracks();
    });
  </script>
</body>
</html>
